<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>365-Day Work & Marks Tracker</title>
  <!-- Chart.js CDN -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <style>
    body {
      font-family: Arial, sans-serif;
      max-width: 1400px;
      margin: 20px auto;
      padding: 20px;
      background-color: #f8f9fa;
    }
    h2 {
      color: #333;
    }
    .chart-box {
      background: #fff;
      padding: 15px;
      border-radius: 8px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
      margin-bottom: 30px;
      height: 420px;
    }
    .table-container {
      max-height: 600px;
      overflow-y: auto;
      background: #fff;
      border-radius: 8px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
    }
    table {
      width: 100%;
      border-collapse: collapse;
      text-align: center;
    }
    th, td {
      padding: 10px;
      border: 1px solid #e0e0e0;
    }
    th {
      background-color: #007bff;
      color: white;
      position: sticky;
      top: 0;
      z-index: 10;
    }
    tr:nth-child(even) {
      background-color: #f9f9f9;
    }
    .works-grid {
      display: grid;
      grid-template-columns: repeat(10, 1fr);
      gap: 6px;
      max-width: 1100px;
      margin: 0 auto;
    }
    .work-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      font-size: 10px;
      background: #f0f4f8;
      padding: 6px 4px;
      border-radius: 4px;
      min-height: 58px;
      text-align: center;
      border: 1px solid #d0d7de;
    }
    .work-item span.title {
      line-height: 1.2;
      font-weight: 600;
    }
    .work-item span.pts {
      font-size: 9px;
      color: #28a745;
      font-weight: bold;
      margin-top: 2px;
    }
    .work-item input {
      cursor: pointer;
      margin-top: 4px;
    }
    .score-cell {
      font-weight: bold;
      color: #007bff;
      font-size: 16px;
    }
    .reset-btn {
      background-color: #dc3545;
      color: white;
      border: none;
      padding: 8px 16px;
      border-radius: 4px;
      cursor: pointer;
      margin-bottom: 15px;
      float: right;
    }
    .reset-btn:hover {
      background-color: #bd2130;
    }
    .date-label {
      font-size: 12px;
      line-height: 1.3;
    }
  </style>
</head>
<body>

  <button class="reset-btn" onclick="resetData()">Reset All Data</button>
  <h2>📈 365-Day Marks & Work Tracker</h2>
  
  <!-- Chart Container -->
  <div class="chart-box">
    <canvas id="marksChart"></canvas>
  </div>

  <h3>Daily Tasks Checklist (Custom Marks per Task / Max 100)</h3>
  <!-- Daily Tasks Table -->
  <div class="table-container">
    <table>
      <thead>
        <tr>
          <th style="width: 14%;">Date & Day</th>
          <th>20 Works Checklist</th>
          <th style="width: 10%;">Total Marks (0-100)</th>
        </tr>
      </thead>
      <tbody id="trackerTableBody">
        <!-- Generated by JavaScript -->
      </tbody>
    </table>
  </div>

  <script>
    const totalDays = 365;
    const totalWorks = 20;

    // Custom labels for all 20 works
    const workLabels = [
      "Biology 1 page",            // Work 1
      "Physics 5 questions",       // Work 2
      "Chemistry 5 questions",     // Work 3
      "5 left arm overs",          // Work 4
      "5 right arm overs",         // Work 5
      "50 shots",                  // Work 6
      "50 catches",                // Work 7
      "10 minutes visualization",  // Work 8
      "10 minutes meditation",     // Work 9
      "1 Book page",               // Work 10
      "10 minutes skipping",       // Work 11
      "100 push ups",              // Work 12
      "20 pull ups",               // Work 13
      "Dumbbell flys 25 side",     // Work 14
      "Dumbbell flys front 25",    // Work 15
      "Military pull ups 10",      // Work 16
      "Barbell curl 10",           // Work 17
      "Planning",                  // Work 18
      "Good work",                 // Work 19
      "Extra work"                 // Work 20
    ];

    // Marks allocation for each work (1 - 20)
    const workMarks = [
      10,   // Work 1
      10,   // Work 2
      10,   // Work 3
      5,    // Work 4
      5,    // Work 5
      2.5,  // Work 6
      2.5,  // Work 7
      2.5,  // Work 8
      10,   // Work 9
      5,    // Work 10
      2.5,  // Work 11
      5,    // Work 12
      2.5,  // Work 13
      2.5,  // Work 14
      2.5,  // Work 15
      2.5,  // Work 16
      2.5,  // Work 17
      10,   // Work 18
      5,    // Work 19
      2.5   // Work 20
    ];

    // Generate formatted date strings with Year (e.g. 2026 August 1 Saturday)
    const daysArray = [];
    const startDate = new Date(2026, 7, 1); // August 1, 2026 (Saturday)

    for (let i = 0; i < totalDays; i++) {
      const currentDate = new Date(startDate);
      currentDate.setDate(startDate.getDate() + i);

      const yearNum = currentDate.getFullYear();
      const monthName = currentDate.toLocaleString('en-US', { month: 'long' });
      const dayNum = currentDate.getDate();
      const dayName = currentDate.toLocaleString('en-US', { weekday: 'long' });

      daysArray.push(`${yearNum} ${monthName} ${dayNum} ${dayName}`);
    }
    
    // Load saved data from browser storage or set defaults
    let savedData = JSON.parse(localStorage.getItem('trackerData')) || {};
    const marksData = new Array(totalDays).fill(0);

    // Initialize Chart.js Line Chart
    const ctx = document.getElementById('marksChart').getContext('2d');
    const marksChart = new Chart(ctx, {
      type: 'line',
      data: {
        labels: daysArray, // Real date strings on horizontal axis
        datasets: [{
          label: 'Total Marks',
          data: marksData,
          borderColor: '#007bff',
          backgroundColor: 'rgba(0, 123, 255, 0.1)',
          borderWidth: 2,
          fill: true,
          tension: 0.1,
          pointRadius: 1.5,
          pointHoverRadius: 5
        }]
      },
      options: {
        responsive: true,
        maintainAspectRatio: false,
        scales: {
          y: {
            min: 0,
            max: 100, // Vertical axis 0 to 100 marks
            title: {
              display: true,
              text: 'Marks (0 - 100)'
            }
          },
          x: {
            title: {
              display: true,
              text: 'Dates (365 Days)'
            }
          }
        }
      }
    });

    // Populate the table with 365 rows and 20 checkboxes per row
    const tableBody = document.getElementById('trackerTableBody');

    for (let day = 1; day <= totalDays; day++) {
      const dayIndex = day - 1;
      const row = document.createElement('tr');

      let worksHtml = '<div class="works-grid">';
      for (let w = 1; w <= totalWorks; w++) {
        const isChecked = savedData[dayIndex] && savedData[dayIndex][w - 1] ? 'checked' : '';
        const labelName = workLabels[w - 1];
        const pts = workMarks[w - 1];

        worksHtml += `
          <div class="work-item">
            <span class="title">${labelName}</span>
            <span class="pts">+${pts}m</span>
            <input type="checkbox" class="day-${dayIndex}" data-pts="${pts}" ${isChecked} onchange="calculateMarks(${dayIndex})">
          </div>`;
      }
      worksHtml += '</div>';

      row.innerHTML = `
        <td class="date-label"><strong>${daysArray[dayIndex]}</strong></td>
        <td>${worksHtml}</td>
        <td class="score-cell" id="score-day-${dayIndex}">0</td>
      `;

      tableBody.appendChild(row);
      
      // Calculate initial score based on loaded state
      calculateMarks(dayIndex, false);
    }

    marksChart.update();

    // Calculate marks dynamically based on checked items
    function calculateMarks(dayIndex, updateChart = true) {
      const checkboxes = document.querySelectorAll(`.day-${dayIndex}`);
      let totalDayMarks = 0;
      let dayState = [];

      checkboxes.forEach((cb) => {
        const pts = parseFloat(cb.getAttribute('data-pts'));
        if (cb.checked) {
          totalDayMarks += pts;
        }
        dayState.push(cb.checked);
      });

      // Format score nicely (remove decimal if whole number)
      const formattedMarks = Number.isInteger(totalDayMarks) ? totalDayMarks : totalDayMarks.toFixed(1);

      // Update UI
      document.getElementById(`score-day-${dayIndex}`).innerText = formattedMarks;
      marksChart.data.datasets[0].data[dayIndex] = totalDayMarks;

      // Save to localStorage
      savedData[dayIndex] = dayState;
      localStorage.setItem('trackerData', JSON.stringify(savedData));

      if (updateChart) {
        marksChart.update();
      }
    }

    // Clear all saved checkboxes
    function resetData() {
      if (confirm("Are you sure you want to reset all your tracked data?")) {
        localStorage.removeItem('trackerData');
        location.reload();
      }
    }
  </script>

</body>
</html>
